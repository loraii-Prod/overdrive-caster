# Render blueprint (optional, for later): one always-on web service with a persistent disk.
# Set CONTROLLER_PASSWORD and ADMIN_PASSWORD in the Render dashboard when prompted.
services:
  - type: web
    name: bnl-caster
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIES
        value: "1"
      - key: CONTROLLER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: caster-data
      mountPath: /var/data
      sizeGB: 1
